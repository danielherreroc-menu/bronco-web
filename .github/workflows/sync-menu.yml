name: Sincronizar menú desde Google Sheet

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install google-api-python-client google-auth
      - name: Escribir credenciales
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > sa.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Regenerar carta
        run: python3 sync_menu.py
      - name: Limpiar credenciales
        run: rm -f sa.json
      - name: Commit si hay cambios
        run: |
          git config user.name "bronco-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add carta/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en la carta."
          else
            git commit -m "Sincronizar carta desde Google Sheet"
            git push
          fi
